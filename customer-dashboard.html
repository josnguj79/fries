<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimana Fries - Customer Orders</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍟</text></svg>">
  <style>
    :root {
      --mc-red: #da291c;
      --mc-yellow: #ffc72c;
      --dark: #1d3557;
      --light: #f8f9fa;
      --success: #28a745;
      --warning: #ff9f1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--light); color: #333; padding-bottom: 2rem; }

    /* Header */
    .header { background: var(--mc-red); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .logo { font-size: 1.2rem; font-weight: bold; color: var(--mc-yellow); display: flex; align-items: center; gap: 6px; }
    .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 0.3rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    .container { max-width: 600px; margin: 1rem auto; padding: 0 1rem; }

    /* Customer Profile Card */
    .profile-card { background: white; border-radius: 12px; padding: 1rem 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .profile-info h3 { color: var(--dark); font-size: 1rem; }
    .profile-info p { color: #666; font-size: 0.85rem; }

    /* Tabs */
    .tabs { display: flex; background: #e2e8f0; border-radius: 8px; padding: 4px; margin-bottom: 1rem; }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: none; font-weight: bold; font-size: 0.9rem; cursor: pointer; border-radius: 6px; transition: 0.2s; color: #555; }
    .tab-btn.active { background: white; color: var(--mc-red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Order Cards */
    .order-card { background: white; border-radius: 10px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid var(--warning); position: relative; }
    .order-card.dispatched { border-left-color: var(--dark); }
    .order-card.delivered { border-left-color: var(--success); opacity: 0.9; }

    .order-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.95rem; margin-bottom: 0.5rem; color: var(--dark); }
    .order-details { font-size: 0.85rem; color: #555; line-height: 1.5; margin-bottom: 0.8rem; }
    
    /* Status Badges */
    .badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: inline-block; text-transform: uppercase; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-dispatched { background: #cce5ff; color: #004085; }
    .badge-delivered { background: #d4edda; color: #155724; }

    /* Rider Contact Box */
    .rider-box { background: #f1f5f9; padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-top: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
    .rider-btn { background: #25D366; color: white; text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: bold; font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" style="display: none;">
    <header class="header">
      <div class="logo">🍟 Kimana Fries</div>
      <button class="logout-btn" id="logoutBtn">Lock Session 🔒</button>
    </header>

    <div class="container">
      <div class="profile-card">
        <div class="profile-info">
          <h3>Customer Orders</h3>
          <p id="phoneDisplay">2547...</p>
        </div>
        <button onclick="refreshOrders()" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;">🔄</button>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('active')">Active Deliveries</button>
        <button class="tab-btn" onclick="switchTab('history')">Order History</button>
      </div>

      <!-- Active Orders Tab -->
      <div id="activeTab" class="tab-content active">
        <div id="activeOrdersList">
          <p style="text-align: center; color: #888; margin-top: 2rem;">Loading active orders...</p>
        </div>
      </div>

      <!-- History Tab -->
      <div id="historyTab" class="tab-content">
        <div id="historyOrdersList">
          <p style="text-align: center; color: #888; margin-top: 2rem;">Loading order history...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SECURITY GATEWAY MODAL (TIMED FALLBACK)   -->
  <!-- ========================================== -->
  <div id="pushSecurityGate" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); text-align: center; font-family: sans-serif;">
      
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
      <h3 style="color: #1e293b; font-size: 1.3rem; margin-bottom: 0.5rem;">BodaSwift Access Gate</h3>
      <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem;">Enter your phone number to generate an access passcode.</p>

      <!-- Phone Entry Step -->
      <div id="phoneStep">
        <input type="tel" id="gatePhoneInput" placeholder="e.g. 254739612301" style="width: 100%; padding: 0.8rem; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; margin-bottom: 1rem;">
        <button id="requestOtpBtn" onclick="handleOtpRequest()" style="width: 100%; padding: 0.85rem; background: #da291c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
          Get Security Passcode 🔑
        </button>
      </div>

      <!-- Code Verification Step -->
      <div id="codeStep" style="display: none;">
        <!-- On-Screen Fallback Display (Revealed after 3 min push timeout) -->
        <div id="fallbackCodeDisplay" style="display: none; background: #f1f5f9; border: 2px dashed #0284c7; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem;">
          <span style="font-size: 0.8rem; color: #475569;">Your Passcode (Fallback):</span><br>
          <strong id="displayCodeText" style="font-size: 1.6rem; color: #0284c7; letter-spacing: 4px;">------</strong>
        </div>

        <input type="text" id="gateCodeInput" placeholder="••••••" maxlength="6" style="width: 100%; padding: 0.8rem; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1.4rem; text-align: center; letter-spacing: 6px; margin-bottom: 1rem;">
        <button onclick="verifyPasscode()" style="width: 100%; padding: 0.85rem; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
          Unlock Portal 🔓
        </button>
      </div>

      <div id="gateStatusMsg" style="font-size: 0.8rem; font-weight: 600; margin-top: 1rem; min-height: 1.2rem;"></div>
    </div>
  </div>

  <!-- DASHBOARD CONTROLLER SCRIPT -->
  <script>
    const API_BASE_URL = 'https://fries-v0l8.onrender.com';
    let activePhone = '';

    const dashboardView = document.getElementById('dashboardView');
    const logoutBtn = document.getElementById('logoutBtn');
    const phoneDisplay = document.getElementById('phoneDisplay');

    // Check existing session on page load
    document.addEventListener('DOMContentLoaded', () => {
      const verifiedPhone = sessionStorage.getItem('bodaswift_verified_phone');
      const sessionToken = sessionStorage.getItem('bodaswift_session_token');

      if (verifiedPhone && sessionToken) {
        document.getElementById('pushSecurityGate').style.display = 'none';
        initDashboard(verifiedPhone);
      } else {
        const savedPhone = localStorage.getItem('kimana_customer_phone');
        if (savedPhone) {
          document.getElementById('gatePhoneInput').value = savedPhone;
        }
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('bodaswift_verified_phone');
      sessionStorage.removeItem('bodaswift_session_token');
      dashboardView.style.display = 'none';
      document.getElementById('pushSecurityGate').style.display = 'flex';
      document.getElementById('phoneStep').style.display = 'block';
      document.getElementById('codeStep').style.display = 'none';
    });

    function refreshOrders() {
      if (activePhone) loadDashboardData(activePhone);
    }

    function initDashboard(phone) {
      activePhone = phone;
      loadDashboardData(phone);
    }

    async function loadDashboardData(phone) {
      dashboardView.style.display = 'block';
      phoneDisplay.textContent = phone;
      localStorage.setItem('kimana_customer_phone', phone);

      try {
        const res = await fetch(`${API_BASE_URL}/api/orders/customer?phone=${phone}`);
        const data = await res.json();

        if (res.ok) {
          renderOrders(data.active, 'activeOrdersList', true);
          renderOrders(data.history, 'historyOrdersList', false);
        } else {
          console.error(data.message || 'Error fetching orders.');
        }
      } catch (err) {
        console.error('Failed to fetch customer orders:', err);
      }
    }

    function renderOrders(orders, containerId, isActiveTab) {
      const container = document.getElementById(containerId);
      if (!orders || orders.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #888; margin-top: 2rem;">No ${isActiveTab ? 'active' : 'past'} orders found.</p>`;
        return;
      }

      container.innerHTML = orders.map(order => {
        const itemsSummary = Array.isArray(order.items)
          ? order.items.map(i => `${i.qty || 1}x ${i.name || 'Item'}`).join(', ')
          : 'Order details';

        let statusBadge = '<span class="badge badge-pending">⏳ Cooking / Pending Dispatch</span>';
        let cardClass = '';

        if (order.status === 'DISPATCHED') {
          statusBadge = '<span class="badge badge-dispatched">🛵 Rider En Route</span>';
          cardClass = 'dispatched';
        } else if (order.status === 'DELIVERED') {
          statusBadge = '<span class="badge badge-delivered">✅ Delivered</span>';
          cardClass = 'delivered';
        }

        const riderPhoneClean = order.riderPhone ? String(order.riderPhone).replace(/\D/g, '') : '';
        const riderWaLink = `https://wa.me/${riderPhoneClean}?text=Hello%20${encodeURIComponent(order.riderName || 'Rider')},%20regarding%20my%20Kimana%20Fries%20order%20${order.id}`;

        let riderBoxHtml = '';
        if (order.riderName) {
          riderBoxHtml = `
            <div class="rider-box">
              <div>
                <strong>🛵 Assigned Rider:</strong> ${order.riderName}
              </div>
              <a href="${riderWaLink}" target="_blank" class="rider-btn">WhatsApp Rider 💬</a>
            </div>
          `;
        } else if (order.status !== 'DELIVERED') {
          riderBoxHtml = `
            <div class="rider-box" style="background: #fff8e6; border: 1px dashed #ffc72c;">
              <div>
                <strong>🛵 Rider Status:</strong> 📡 Searching for nearby BodaSwift rider...
              </div>
            </div>
          `;
        }

        return `
          <div class="order-card ${cardClass}">
            <div class="order-header">
              <span>🆔 #${order.id}</span>
              <span>KES ${order.totalAmount}</span>
            </div>
            <div class="order-details">
              <p><strong>📍 Delivery To:</strong> ${order.deliveryLocation}</p>
              <p><strong>🍟 Items:</strong> ${itemsSummary}</p>
              <p style="margin-top: 6px;">${statusBadge}</p>
            </div>
            ${riderBoxHtml}
          </div>
        `;
      }).join('');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'active') {
        document.querySelector('.tabs button:nth-child(1)').classList.add('active');
        document.getElementById('activeTab').classList.add('active');
      } else {
        document.querySelector('.tabs button:nth-child(2)').classList.add('active');
        document.getElementById('historyTab').classList.add('active');
      }
    }
  </script>

  <!-- FIREBASE WEB PUSH AUTH SCRIPT (WITH TIMED MULTI-STAGE FALLBACK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-messaging.js";

    const BACKEND_API = 'https://fries-v0l8.onrender.com';

    let app, messaging, VAPID_KEY;
    let countdownTimer = null;
    let cachedFallbackCode = '';

    // Dynamically load Firebase config from Render environment variables via server endpoint
    // Dynamically load Firebase config from Render environment variables via server endpoint
    async function initFirebaseClient() {
      try {
        const res = await fetch(`${BACKEND_API}/api/config/firebase`);
        const config = await res.json();

        if (!config.apiKey) {
          console.error('❌ [Firebase Error] Render environment variables for Firebase client are missing or empty!', config);
          return;
        }

        VAPID_KEY = config.vapidKey;
        app = initializeApp(config);
        messaging = getMessaging(app);
        console.log('✅ Firebase Client successfully initialized via Render config!');
      } catch (err) {
        console.error('Failed to load Firebase client config:', err);
      }
    }

    initFirebaseClient();

    window.handleOtpRequest = async function() {
      const phoneInput = document.getElementById('gatePhoneInput');
      const statusMsg = document.getElementById('gateStatusMsg');
      activePhone = phoneInput.value.trim();

      if (!activePhone) return alert('Please enter your phone number');

      statusMsg.style.color = '#0284c7';
      statusMsg.textContent = '🔄 Requesting notification permissions...';

      // 1. Request Browser Permission and Register Device Push Token
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted' && messaging) {
          statusMsg.textContent = '🔄 Registering device push token...';
          const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
          const fcmToken = await getToken(messaging, { 
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: registration 
          });

          if (fcmToken) {
            await fetch(`${BACKEND_API}/api/notifications/register-token`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: activePhone, token: fcmToken, role: 'customer' })
            });
          }
        }
      } catch (e) {
        console.warn('Push token registration skipped or failed:', e);
      }

      statusMsg.textContent = '📤 Attempting Web Push notification...';

      // 2. Request OTP Code from Backend
      try {
        const res = await fetch(`${BACKEND_API}/api/auth/request-push-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: activePhone })
        });

        const data = await res.json();
        if (res.ok) {
          cachedFallbackCode = data.fallbackCode;
          document.getElementById('phoneStep').style.display = 'none';
          document.getElementById('codeStep').style.display = 'block';

          // Start 3-Minute (180s) Push Window Timer
          startPushTimeoutTimer();
        } else {
          statusMsg.style.color = '#da291c';
          statusMsg.textContent = data.message || 'Failed to generate code.';
        }
      } catch (err) {
        statusMsg.style.color = '#da291c';
        statusMsg.textContent = 'Server connection error.';
      }
    };

    function startPushTimeoutTimer() {
      let timeLeft = 180; // 3 minutes window
      const statusMsg = document.getElementById('gateStatusMsg');
      const fallbackDisplay = document.getElementById('fallbackCodeDisplay');
      const displayCodeText = document.getElementById('displayCodeText');

      countdownTimer = setInterval(async () => {
        timeLeft--;
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        let timeFormatted = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (timeLeft > 0) {
          statusMsg.style.color = '#d97706';
          statusMsg.textContent = `⏳ Waiting for Push notification (${timeFormatted} remaining)...`;
        } else {
          clearInterval(countdownTimer);
          
          // Push Timer Expired: Reveal On-Screen Code & Trigger WhatsApp Backup
          statusMsg.style.color = '#0284c7';
          statusMsg.textContent = 'Push timed out. Revealing on-screen code & sending WhatsApp backup...';
          
          fallbackDisplay.style.display = 'block';
          displayCodeText.textContent = cachedFallbackCode;

          try {
            await fetch(`${BACKEND_API}/api/auth/fallback-whatsapp`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: activePhone })
            });
            statusMsg.textContent = '💬 Passcode sent via WhatsApp & displayed on-screen!';
          } catch (waErr) {
            console.error('WhatsApp fallback error:', waErr);
          }
        }
      }, 1000);
    }

    window.verifyPasscode = async function() {
      const code = document.getElementById('gateCodeInput').value.trim();
      if (!activePhone) activePhone = document.getElementById('gatePhoneInput').value.trim();

      if (code.length !== 6) {
        return alert('Please enter the 6-digit code.');
      }

      try {
        const res = await fetch(`${BACKEND_API}/api/auth/verify-push-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: activePhone, code })
        });

        const data = await res.json();
        if (res.ok) {
          if (countdownTimer) clearInterval(countdownTimer);
          sessionStorage.setItem('bodaswift_session_token', data.token);
          sessionStorage.setItem('bodaswift_verified_phone', data.phone);
          document.getElementById('pushSecurityGate').style.display = 'none';
          initDashboard(data.phone);
        } else {
          alert(data.message || 'Invalid passcode.');
        }
      } catch (err) {
        alert('Network error verifying passcode.');
      }
    };
  </script>
</body>
</html>
