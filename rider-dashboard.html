<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodaSwift - Rider Dashboard</title>
  <style>
    :root {
      --mc-red: #da291c;
      --mc-yellow: #ffc72c;
      --dark: #1d3557;
      --light: #f8f9fa;
      --success: #28a745;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--light); color: #333; padding-bottom: 2rem; }

    /* Header */
    .header { background: var(--dark); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 1.2rem; font-weight: bold; color: var(--mc-yellow); }
    .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 0.3rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    .container { max-width: 600px; margin: 1rem auto; padding: 0 1rem; }

    /* Profile / Status Card */
    .profile-card { background: white; border-radius: 12px; padding: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .rider-info h3 { color: var(--dark); font-size: 1.1rem; }
    .rider-info p { color: #666; font-size: 0.85rem; margin-top: 2px; }

    /* GPS Live Status Badge */
    .gps-status-pill { display: inline-block; background: #e0f2fe; color: #0284c7; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }

    /* Toggle Switch */
    .switch-container { display: flex; align-items: center; gap: 8px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(24px); }
    .status-label { font-size: 0.8rem; font-weight: bold; text-align: center; display: block; margin-top: 4px; }

    /* Tabs */
    .tabs { display: flex; background: #e2e8f0; border-radius: 8px; padding: 4px; margin-bottom: 1rem; }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: none; font-weight: bold; font-size: 0.9rem; cursor: pointer; border-radius: 6px; transition: 0.2s; color: #555; }
    .tab-btn.active { background: white; color: var(--dark); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Order Cards */
    .order-card { background: white; border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 4px solid var(--mc-yellow); }
    .order-card.delivered { border-left-color: var(--success); opacity: 0.85; }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.95rem; margin-bottom: 0.5rem; color: var(--dark); }
    .order-details { font-size: 0.85rem; color: #555; line-height: 1.4; margin-bottom: 0.8rem; }
    
    .btn-action { width: 100%; padding: 0.7rem; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .badge-delivered { background: #e6f4ea; color: var(--success); padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
  </style>
</head>
<body>

  <!-- DASHBOARD VIEW (Unlocked after verification) -->
  <div id="dashboardView" style="display: none;">
    <header class="header">
      <div class="logo">🛵 BodaSwift Rider</div>
      <button class="logout-btn" id="logoutBtn">Lock Session 🔒</button>
    </header>

    <div class="container">
      <!-- Profile & Status Toggle -->
      <div class="profile-card">
        <div class="rider-info">
          <h3 id="riderNameDisplay">Rider Name</h3>
          <p id="riderPhoneDisplay">2547...</p>
          <div style="display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap;">
            <span id="gpsStatusBadge" class="gps-status-pill">📡 GPS Standby</span>
            <span id="riderRatingBadge" class="gps-status-pill" style="background: #fef3c7; color: #d97706;">⭐ -- (0 reviews)</span>
          </div>
        </div>
        <div>
          <label class="switch">
            <input type="checkbox" id="statusToggle">
            <span class="slider"></span>
          </label>
          <span id="statusText" class="status-label">OFFLINE</span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')">Pending Orders</button>
        <button class="tab-btn" onclick="switchTab('completed')">Completed History</button>
      </div>

      <!-- Pending Tab -->
      <div id="pendingTab" class="tab-content active">
        <div id="pendingOrdersList">
          <p style="text-align: center; color: #888; margin-top: 2rem;">No active assigned orders.</p>
        </div>
      </div>

      <!-- Completed Tab -->
      <div id="completedTab" class="tab-content">
        <div id="completedOrdersList">
          <p style="text-align: center; color: #888; margin-top: 2rem;">No completed deliveries yet today.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SECURITY GATEWAY MODAL (TIMED FALLBACK)   -->
  <!-- ========================================== -->
  <div id="pushSecurityGate" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); text-align: center; font-family: sans-serif;">
      
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
      <h3 style="color: #1e293b; font-size: 1.3rem; margin-bottom: 0.5rem;">Rider Access Gate</h3>
      <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem;">Enter your registered phone number to unlock your shift.</p>

      <!-- Phone Entry Step -->
      <div id="phoneStep">
        <input type="tel" id="gatePhoneInput" placeholder="e.g. 254739612301" style="width: 100%; padding: 0.8rem; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; margin-bottom: 1rem;">
        <button id="requestOtpBtn" onclick="handleOtpRequest()" style="width: 100%; padding: 0.85rem; background: #da291c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
          Get Security Passcode 🔑
        </button>
      </div>

      <!-- Code Verification Step -->
      <div id="codeStep" style="display: none;">
        <!-- On-Screen Fallback Display -->
        <div id="fallbackCodeDisplay" style="display: none; background: #f1f5f9; border: 2px dashed #0284c7; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem;">
          <span style="font-size: 0.8rem; color: #475569;">Your Passcode (Fallback):</span><br>
          <strong id="displayCodeText" style="font-size: 1.6rem; color: #0284c7; letter-spacing: 4px;">------</strong>
        </div>

        <input type="text" id="gateCodeInput" placeholder="••••••" maxlength="6" style="width: 100%; padding: 0.8rem; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1.4rem; text-align: center; letter-spacing: 6px; margin-bottom: 1rem;">
        <button onclick="verifyPasscode()" style="width: 100%; padding: 0.85rem; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
          Unlock Shift 🔓
        </button>
      </div>

      <div id="gateStatusMsg" style="font-size: 0.8rem; font-weight: 600; margin-top: 1rem; min-height: 1.2rem;"></div>
    </div>
  </div>

  <!-- DASHBOARD CONTROLLER & GPS TRACKER SCRIPT -->
  <script>
    const API_BASE_URL = 'https://fries-v0l8.onrender.com';
    let activePhone = '';
    let gpsWatchId = null;

    const dashboardView = document.getElementById('dashboardView');
    const logoutBtn = document.getElementById('logoutBtn');
    const riderNameDisplay = document.getElementById('riderNameDisplay');
    const riderPhoneDisplay = document.getElementById('riderPhoneDisplay');
    const statusToggle = document.getElementById('statusToggle');
    const statusText = document.getElementById('statusText');

    // Check existing session on page load
    document.addEventListener('DOMContentLoaded', () => {
      const verifiedPhone = sessionStorage.getItem('bodaswift_verified_phone');
      const sessionToken = sessionStorage.getItem('bodaswift_session_token');

      if (verifiedPhone && sessionToken) {
        document.getElementById('pushSecurityGate').style.display = 'none';
        initDashboard(verifiedPhone);
      } else {
        const savedPhone = localStorage.getItem('bodaswift_rider_phone');
        if (savedPhone) {
          document.getElementById('gatePhoneInput').value = savedPhone;
        }
      }
    });

    logoutBtn.addEventListener('click', () => {
      stopLiveGpsTracking();
      sessionStorage.removeItem('bodaswift_verified_phone');
      sessionStorage.removeItem('bodaswift_session_token');
      dashboardView.style.display = 'none';
      document.getElementById('pushSecurityGate').style.display = 'flex';
      document.getElementById('phoneStep').style.display = 'block';
      document.getElementById('codeStep').style.display = 'none';
    });

    function initDashboard(phone) {
      activePhone = phone;
      loadDashboardData(phone);
    }

    async function loadDashboardData(phone) {
      dashboardView.style.display = 'block';
      riderPhoneDisplay.textContent = phone;
      localStorage.setItem('bodaswift_rider_phone', phone);

      // 1. Fetch Rider Status & Profile
      try {
        const res = await fetch(`${API_BASE_URL}/api/riders/status?phone=${phone}`);
        const data = await res.json();

        if (res.ok) {
          riderNameDisplay.textContent = data.name;
          statusToggle.checked = data.isAvailable;
          statusText.textContent = data.isAvailable ? 'ONLINE' : 'OFFLINE';
          statusText.style.color = data.isAvailable ? 'var(--success)' : '#888';
        }
      } catch (err) {
        console.error('Failed to load profile status');
      }

      // 2. Fetch Rider Ratings Summary
      try {
        const ratingRes = await fetch(`${API_BASE_URL}/api/rider/ratings/${phone}`);
        const ratingData = await ratingRes.json();
        if (ratingData.success) {
          const badge = document.getElementById('riderRatingBadge');
          if (badge) {
            badge.textContent = `⭐ ${ratingData.averageRating} (${ratingData.totalReviews} reviews)`;
          }
        }
      } catch (e) {
        console.warn('Could not load rider ratings summary');
      }

      // 3. Fetch Rider's Pending & Completed Orders
      try {
        const res = await fetch(`${API_BASE_URL}/api/orders/rider?phone=${phone}`);
        const data = await res.json();

        if (res.ok) {
          renderOrders(data.pending, 'pendingOrdersList', true);
          renderOrders(data.completed, 'completedOrdersList', false);

          // If there is an active pending order, start live GPS broadcasting automatically!
          if (data.pending && data.pending.length > 0) {
            startLiveGpsTracking(data.pending[0].id, phone);
          } else {
            stopLiveGpsTracking();
          }
        }
      } catch (err) {
        console.error('Failed to load rider orders');
      }
    }

    function renderOrders(orders, containerId, isPending) {
      const container = document.getElementById(containerId);
      if (!orders || orders.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #888; margin-top: 2rem;">No ${isPending ? 'active assigned' : 'completed'} orders found.</p>`;
        return;
      }

      container.innerHTML = orders.map(order => {
        const itemsSummary = Array.isArray(order.items) 
          ? order.items.map(i => `${i.qty || 1}x ${i.name || 'Item'}`).join(', ') 
          : 'Order details';

        const cleanCustomerPhone = String(order.customerPhone || '').replace(/\D/g, '');
        const whatsappLink = `https://wa.me/${cleanCustomerPhone}?text=Hello,%20this%20is%20your%20BodaSwift%20rider%20with%20your%20Kimana%20Fries%20order%20(${order.id})`;
        const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.deliveryLocation || '')}`;

        return `
          <div class="order-card ${!isPending ? 'delivered' : ''}" id="card-${order.id}">
            <div class="order-header">
              <span>🆔 #${order.id}</span>
              <span>KES ${order.totalAmount}</span>
            </div>
            <div class="order-details">
              <p><strong>📍 Location:</strong> <a href="${mapsLink}" target="_blank" style="color: #007bff; text-decoration: underline;">${order.deliveryLocation} 🗺️</a></p>
              <p><strong>📞 Customer:</strong> <a href="${whatsappLink}" target="_blank" style="color: #25D366; font-weight: bold; text-decoration: none;">${order.customerPhone} 💬</a></p>
              <p><strong>🍟 Items:</strong> ${itemsSummary}</p>
            </div>
            ${isPending ? `
              <button class="btn-action" id="btn-${order.id}" onclick="markDelivered('${order.id}')">MARK AS DELIVERED ✅</button>
            ` : `
              <span class="badge-delivered">DELIVERED</span>
            `}
          </div>
        `;
      }).join('');
    }

    async function markDelivered(orderId) {
      if (!activePhone || !orderId) return;

      const btn = document.getElementById(`btn-${orderId}`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Updating status... ⏳';
        btn.style.opacity = '0.7';
      }

      try {
        const res = await fetch(`${API_BASE_URL}/api/orders/deliver`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, riderPhone: activePhone })
        });

        const data = await res.json();
        if (res.ok) {
          stopLiveGpsTracking();
          alert(`✅ Order ${orderId} marked as DELIVERED!`);
          loadDashboardData(activePhone);
        } else {
          alert(data.message || 'Failed to update delivery status.');
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'MARK AS DELIVERED ✅';
            btn.style.opacity = '1';
          }
        }
      } catch (err) {
        alert('Network error. Please try again.');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'MARK AS DELIVERED ✅';
          btn.style.opacity = '1';
        }
      }
    }

    // ==========================================
    // RIDER GPS TRACKING ENGINE
    // ==========================================
    function startLiveGpsTracking(orderId, riderPhone) {
      if (!('geolocation' in navigator)) {
        console.warn('GPS Tracking not supported on this device.');
        return;
      }

      const statusBadge = document.getElementById('gpsStatusBadge');
      if (statusBadge) {
        statusBadge.textContent = '📡 GPS Live';
        statusBadge.style.background = '#dcfce7';
        statusBadge.style.color = '#15803d';
      }

      if (gpsWatchId !== null) return; // Already watching

      gpsWatchId = navigator.geolocation.watchPosition(
        async (position) => {
          const { latitude, longitude, heading, speed } = position.coords;

          try {
            await fetch(`${API_BASE_URL}/api/rider/location`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                orderId,
                riderPhone,
                lat: latitude,
                lng: longitude,
                heading: heading || 0,
                speed: speed || 0,
                timestamp: Date.now()
              })
            });
          } catch (err) {
            console.error('[Rider GPS Dispatch Error]:', err);
          }
        },
        (err) => {
          console.warn('[Rider GPS Error]:', err.message);
          if (statusBadge) statusBadge.textContent = '⚠️ GPS Error';
        },
        {
          enableHighAccuracy: true,
          maximumAge: 4000,
          timeout: 8000
        }
      );
    }

    function stopLiveGpsTracking() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        const statusBadge = document.getElementById('gpsStatusBadge');
        if (statusBadge) {
          statusBadge.textContent = '📡 GPS Standby';
          statusBadge.style.background = '#e0f2fe';
          statusBadge.style.color = '#0284c7';
        }
      }
    }

    statusToggle.addEventListener('change', async () => {
      const isAvailable = statusToggle.checked ? 1 : 0;

      try {
        const res = await fetch(`${API_BASE_URL}/api/riders/toggle-status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: activePhone, isAvailable })
        });
        const data = await res.json();

        if (res.ok) {
          statusText.textContent = isAvailable ? 'ONLINE' : 'OFFLINE';
          statusText.style.color = isAvailable ? 'var(--success)' : '#888';
        } else {
          statusToggle.checked = !isAvailable;
        }
      } catch (err) {
        statusToggle.checked = !isAvailable;
      }
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'pending') {
        document.querySelector('.tabs button:nth-child(1)').classList.add('active');
        document.getElementById('pendingTab').classList.add('active');
      } else {
        document.querySelector('.tabs button:nth-child(2)').classList.add('active');
        document.getElementById('completedTab').classList.add('active');
      }
    }
  </script>

  <!-- FIREBASE WEB PUSH AUTH SCRIPT (WITH TARGETED TOKEN OTP) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-messaging.js";

    const BACKEND_API = 'https://fries-v0l8.onrender.com';

    let app, messaging, VAPID_KEY;
    let countdownTimer = null;
    let cachedFallbackCode = '';
    let currentFcmToken = null;

    async function initFirebaseClient() {
      try {
        const res = await fetch(`${BACKEND_API}/api/config/firebase`);
        const config = await res.json();
        VAPID_KEY = config.vapidKey;

        app = initializeApp(config);
        messaging = getMessaging(app);
      } catch (err) {
        console.error('Failed to load Firebase client config:', err);
      }
    }

    initFirebaseClient();

    window.handleOtpRequest = async function() {
      const phoneInput = document.getElementById('gatePhoneInput');
      const statusMsg = document.getElementById('gateStatusMsg');
      activePhone = phoneInput.value.trim();

      if (!activePhone) return alert('Please enter your phone number');

      statusMsg.style.color = '#0284c7';
      statusMsg.textContent = '🔄 Requesting notification permissions...';

      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted' && messaging) {
          statusMsg.textContent = '🔄 Registering device push token...';
          const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
          currentFcmToken = await getToken(messaging, { 
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: registration 
          });

          if (currentFcmToken) {
            await fetch(`${BACKEND_API}/api/notifications/register-token`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: activePhone, token: currentFcmToken, role: 'rider' })
            });
          }
        }
      } catch (e) {
        console.warn('Push token registration skipped or failed:', e);
      }

      statusMsg.textContent = '📤 Attempting Web Push notification...';

      try {
        // Pass currentFcmToken so backend targets ONLY this requesting rider device
        const res = await fetch(`${BACKEND_API}/api/auth/request-push-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: activePhone, token: currentFcmToken })
        });

        const data = await res.json();
        if (res.ok) {
          cachedFallbackCode = data.fallbackCode;
          document.getElementById('phoneStep').style.display = 'none';
          document.getElementById('codeStep').style.display = 'block';

          startPushTimeoutTimer();
        } else {
          statusMsg.style.color = '#da291c';
          statusMsg.textContent = data.message || 'Failed to generate code.';
        }
      } catch (err) {
        statusMsg.style.color = '#da291c';
        statusMsg.textContent = 'Server connection error.';
      }
    };

    function startPushTimeoutTimer() {
      let timeLeft = 180;
      const statusMsg = document.getElementById('gateStatusMsg');
      const fallbackDisplay = document.getElementById('fallbackCodeDisplay');
      const displayCodeText = document.getElementById('displayCodeText');

      countdownTimer = setInterval(async () => {
        timeLeft--;
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        let timeFormatted = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (timeLeft > 0) {
          statusMsg.style.color = '#d97706';
          statusMsg.textContent = `⏳ Waiting for Push notification (${timeFormatted} remaining)...`;
        } else {
          clearInterval(countdownTimer);
          
          statusMsg.style.color = '#0284c7';
          statusMsg.textContent = 'Push timed out. Revealing on-screen code & sending WhatsApp backup...';
          
          fallbackDisplay.style.display = 'block';
          displayCodeText.textContent = cachedFallbackCode;

          try {
            await fetch(`${BACKEND_API}/api/auth/fallback-whatsapp`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: activePhone })
            });
            statusMsg.textContent = '💬 Passcode sent via WhatsApp & displayed on-screen!';
          } catch (waErr) {
            console.error('WhatsApp fallback error:', waErr);
          }
        }
      }, 1000);
    }

    window.verifyPasscode = async function() {
      const code = document.getElementById('gateCodeInput').value.trim();
      if (!activePhone) activePhone = document.getElementById('gatePhoneInput').value.trim();

      if (code.length !== 6) {
        return alert('Please enter the 6-digit code.');
      }

      try {
        const res = await fetch(`${BACKEND_API}/api/auth/verify-push-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: activePhone, code })
        });

        const data = await res.json();
        if (res.ok) {
          if (countdownTimer) clearInterval(countdownTimer);
          sessionStorage.setItem('bodaswift_session_token', data.token);
          sessionStorage.setItem('bodaswift_verified_phone', data.phone);
          document.getElementById('pushSecurityGate').style.display = 'none';
          initDashboard(data.phone);
        } else {
          alert(data.message || 'Invalid passcode.');
        }
      } catch (err) {
        alert('Network error verifying passcode.');
      }
    };
  </script>
</body>
</html>
